{% extends "medico/base.html" %}

{% block content %}


    <main class="conteudo-principal">


        <header class="cabecalho-principal">

            <div>

                <span class="rotulo">
                    Exame
                </span>

                <h1>
                    Atendimento
                </h1>

                <p class="subtitulo">
                    Registre as informações referentes ao exame.
                </p>

            </div>

        </header>


        <section class="secao">


            <div class="cabecalho-secao">

                <h2>
                    Dados do paciente
                </h2>

            </div>


            <div class="grade-perfil">

                <div class="item-perfil">

                    <span class="rotulo-perfil">
                        Paciente
                    </span>

                    <span class="valor-perfil">
                        {{ paciente.nome }}
                    </span>

                </div>


                <div class="item-perfil">

                    <span class="rotulo-perfil">
                        Especialidade
                    </span>

                    <span class="valor-perfil">
                        {{ especialidade }}
                    </span>

                </div>


                <div class="item-perfil">

                    <span class="rotulo-perfil">
                        Data
                    </span>

                    <span class="valor-perfil">
                        {{ exame.data|date:"d/m/Y H:i" }}
                    </span>

                </div>

            </div>


        </section>


        <section class="secao">


            <div class="cabecalho-secao">

                <h2>
                    Registro do exame
                </h2>

            </div>


            <form
                method="POST"
                class="formulario-secao"
            >

                {% csrf_token %}


                <div class="campo">

                    <label for="resultado">
                        Resultado
                    </label>

                    <textarea
                        id="resultado"
                        name="resultado"
                        placeholder="Registre o resultado do exame..."
                    >{{ atendimento.resultado }}</textarea>

                </div>


                <div class="campo">

                    <label for="conclusao">
                        Conclusão
                    </label>

                    <textarea
                        id="conclusao"
                        name="conclusao"
                        placeholder="Registre a conclusão do exame..."
                    >{{ atendimento.conclusao }}</textarea>

                </div>


                <div class="campo">

                    <label for="observacoes_tecnicas">
                        Observações técnicas
                    </label>

                    <textarea
                        id="observacoes_tecnicas"
                        name="observacoes_tecnicas"
                        placeholder="Registre observações técnicas..."
                    >{{ atendimento.observacoes_tecnicas }}</textarea>

                </div>


                <div class="campo">

                    <label for="observacoes">
                        Observações
                    </label>

                    <textarea
                        id="observacoes"
                        name="observacoes"
                        placeholder="Registre informações adicionais..."
                    >{{ atendimento.observacoes }}</textarea>

                </div>


                <button
                    type="submit"
                    class="botao-primario"
                >
                    Salvar atendimento
                </button>

            </form>


        </section>


    </main>

</div>

</body>
</html>
{% endblock%}
