{% extends "gestao/base.html" %}

{% block title %}
Cadastrar Médico
{% endblock %}

{% block titulo %}
Cadastrar Médico
{% endblock %}

{% block subtitulo %}
Cadastre um novo médico no sistema.
{% endblock %}

{% block content %}

<div class="secao">

    <div class="cabecalho-secao">
        <h2>Dados do médico</h2>
    </div>

    <form method="POST"
          action="{% url 'gestao_clinica:criar_medico' %}">

        {% csrf_token %}

        <div class="grade-campos">

            <div class="campo">
                <label for="nome">Nome completo</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    required
                >
            </div>


            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >
            </div>


            <div class="campo">
                <label for="idade">Idade</label>

                <input
                    type="number"
                    id="idade"
                    name="idade"
                    required
                >
            </div>


            <div class="campo">
                <label for="crm">CRM</label>

                <input
                    type="text"
                    id="crm"
                    name="crm"
                    required
                >
            </div>


            <div class="campo">
                <label for="cpf">CPF</label>

                <input
                    type="text"
                    id="cpf"
                    name="cpf"
                    required
                >
            </div>


            <div class="campo">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    required
                >
            </div>


            <div class="campo">
                <label for="especialidade">
                    Especialidade
                </label>

                <select
                    id="especialidade"
                    name="especialidade"
                    required
                >

                    <option value="">
                        Selecione uma especialidade
                    </option>

                    {% for valor, nome in especialidade_choices %}

                        <option value="{{ valor }}">
                            {{ nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>

        </div>



        <button
            type="submit"
            class="botao-primario"
        >
            Cadastrar médico
        </button>


        <a
            href="{% url 'gestao_clinica:listar_medicos' %}"
            class="botao-secundario"
        >
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
